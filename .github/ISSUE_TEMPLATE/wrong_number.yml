name: An estimate looks wrong
description: sublift reported a number you believe is incorrect, or an interval that does not cover.
labels: ["correctness"]
body:
  - type: markdown
    attributes:
      value: >
        This is the most important kind of issue this project can get. A visibly wrong number is
        a bug; a *confidently* wrong number is worse, because someone will make a pricing
        decision on it. Thank you for taking the time.
  - type: textarea
    id: what
    attributes:
      label: What did sublift report, and what did you expect?
      placeholder: |
        incremental_ltv(...) returned +3.2 [+2.9, +3.5], but ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >
        Ideally using `sublift.simulate_experiment`, so the true effect is known and we can both
        run it. If it only reproduces on your data, a description of the shape — sample size,
        censoring rate, horizon, arm split — is still very useful.
      render: python
      placeholder: |
        import sublift as sl
        sim = sl.simulate_experiment(n=20_000, treatment_odds_ratio=0.9, seed=0)
        res = sl.retained_periods_lift(sim.panel, horizon=12, estimator="unadjusted")
        print(res.estimate, sim.true_rmst_lift)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sublift version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: panel
    attributes:
      label: Panel summary
      description: "Output of `print(panel)` and `panel.describe()`, if you can share it."
      render: text
