name: Bug report
description: Something crashes, errors unexpectedly, or behaves differently from the docs.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: text
  - type: input
    id: version
    attributes:
      label: sublift version / Python version
      placeholder: "sublift 0.1.0, Python 3.12"
    validations:
      required: true
